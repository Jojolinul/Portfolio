<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive AR/3D Web App - Fixed Controls</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none; /* Prevent default touch behaviors */
    }
    #debugInfo {
      position: fixed;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 100;
      color: white;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
      pointer-events: none; /* Allow clicks to pass through */
    }
    .settingsButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000; /* Increased z-index */
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px; /* Increased size */
      height: 60px; /* Increased size */
      font-size: 28px; /* Increased font size */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
    }
    .settingsMenu {
      position: fixed;
      bottom: 90px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      display: none;
      z-index: 1000; /* Increased z-index */
      min-width: 180px; /* Minimum width */
    }
    .settingsMenu button {
      display: block;
      margin: 8px 0;
      width: 100%;
      padding: 12px; /* Larger buttons */
      background-color: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 5px;
      color: black;
      cursor: pointer;
      font-size: 16px; /* Larger text */
    }
    .instructions {
      position: fixed;
      top: 50px;
      left: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 10px;
      z-index: 100;
      text-align: center;
      pointer-events: none; /* Allow clicks to pass through */
    }
    #desktopControls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 10px;
      color: white;
      z-index: 100;
      display: none;
      pointer-events: none; /* Allow clicks to pass through */
    }
    #arButton {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      z-index: 1000;
      cursor: pointer;
      display: none; /* Hidden initially */
    }
  </style>
</head>
<body>
  <div class="instructions" id="instructions">Loading...</div>
  <div id="debugInfo">Initializing...</div>
  
  <button class="settingsButton" id="settingsButton">⚙️</button>
  <div class="settingsMenu" id="settingsMenu">
    <button id="rotateXPlus">Rotate X +</button>
    <button id="rotateXMinus">Rotate X -</button>
    <button id="rotateYPlus">Rotate Y +</button>
    <button id="rotateYMinus">Rotate Y -</button>
    <button id="moveForward">Move Forward</button>
    <button id="moveBackward">Move Backward</button>
    <button id="moveLeft">Move Left</button>
    <button id="moveRight">Move Right</button>
    <button id="resetPosition">Reset Position</button>
  </div>
  
  <button id="arButton">Enter AR</button>
  
  <div id="desktopControls">
    <p>Desktop Controls:</p>
    <p>WASD - Move Camera</p>
    <p>Arrow Keys - Rotate Camera</p>
    <p>Click - Place Model</p>
    <p>Scroll - Zoom In/Out</p>
  </div>

  <script>
    // Global variables
    let camera, scene, renderer;
    let model, video, audioListener, sound;
    let isModelPlaced = false;
    let modelLoaded = false;
    let settingsOpen = false;
    let isMobile = false;
    let controls;
    let ground;
    let raycaster, mouse;
    let keyStates = {};
    let xrButton = null;
    let xrSessionActive = false;
    let reticle = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    
    // Detect if device is mobile
    function detectMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
             (window.innerWidth <= 800 && window.innerHeight <= 600);
    }
    
    // Initialize the application
    function init() {
      isMobile = detectMobile();
      const debugInfo = document.getElementById('debugInfo');
      debugInfo.textContent = isMobile ? 'Mobile Mode' : 'Desktop Mode';
      
      // Update instructions based on device type
      const instructions = document.getElementById('instructions');
      if (isMobile) {
        instructions.textContent = 'Initializing AR...';
        document.getElementById('desktopControls').style.display = 'none';
      } else {
        instructions.textContent = 'Click anywhere to place the 3D model';
        document.getElementById('desktopControls').style.display = 'block';
      }
      
      // Create scene
      scene = new THREE.Scene();
      
      // Create camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // Eye level height
      
      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);
      
      // Add lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 10, 5);
      scene.add(directionalLight);
      
      // Audio listener for spatial audio
      audioListener = new THREE.AudioListener();
      camera.add(audioListener);
      
      // Setup based on device type
      if (isMobile) {
        setupMobileAR();
      } else {
        setupDesktopEnvironment();
      }
      
      // Load 3D model
      loadModel();
      
      // Raycaster for object placement
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();
      
      // Add event listeners
      window.addEventListener('resize', onWindowResize);
      
      if (isMobile) {
        // Mobile specific event listeners handled in setupMobileAR
      } else {
        window.addEventListener('click', onClick);
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('wheel', onWheel);
      }
      
      // Settings menu interactions - use separate event handling for better touch support
      const settingsButton = document.getElementById('settingsButton');
      settingsButton.addEventListener('touchend', function(e) {
        e.preventDefault(); // Prevent double firing
        toggleSettings();
      }, false);
      settingsButton.addEventListener('click', toggleSettings, false);
      
      // Add touchend and click events for all control buttons
      addButtonEventListeners('rotateXPlus', () => rotateModel(0.1, 0, 0));
      addButtonEventListeners('rotateXMinus', () => rotateModel(-0.1, 0, 0));
      addButtonEventListeners('rotateYPlus', () => rotateModel(0, 0.1, 0));
      addButtonEventListeners('rotateYMinus', () => rotateModel(0, -0.1, 0));
      addButtonEventListeners('moveForward', () => moveModel(0, 0, -0.1));
      addButtonEventListeners('moveBackward', () => moveModel(0, 0, 0.1));
      addButtonEventListeners('moveLeft', () => moveModel(-0.1, 0, 0));
      addButtonEventListeners('moveRight', () => moveModel(0.1, 0, 0));
      addButtonEventListeners('resetPosition', resetModelPosition);
      
      // Start animation loop
      if (!isMobile || !checkXRSupport()) {
        // Use standard animation loop if not in XR
        animate();
      }
    }
    
    // Helper function to add both click and touch events to buttons
    function addButtonEventListeners(id, callback) {
      const element = document.getElementById(id);
      if (element) {
        element.addEventListener('touchend', function(e) {
          e.preventDefault(); // Prevent double firing
          callback();
        }, false);
        element.addEventListener('click', callback, false);
      }
    }
    
    // Check WebXR support
    function checkXRSupport() {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            document.getElementById('arButton').style.display = 'block';
            document.getElementById('instructions').textContent = 'Press "Enter AR" to begin';
            return true;
          } else {
            console.warn('WebXR AR not supported on this device');
            return false;
          }
        });
      } else {
        console.warn('WebXR not supported on this browser');
        return false;
      }
      return false;
    }
    
    // Setup for mobile AR experience
    function setupMobileAR() {
      // Check if WebXR is supported
      if (navigator.xr && navigator.xr.isSessionSupported) {
        // Check if immersive-ar mode is supported
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            setupWebXR();
          } else {
            console.warn('WebXR AR not supported on this device');
            fallbackToVideoAR();
          }
        });
      } else {
        console.warn('WebXR not supported on this browser');
        fallbackToVideoAR();
      }
    }
    
    // Setup WebXR
    function setupWebXR() {
      // Enable XR rendering
      renderer.xr.enabled = true;
      
      // Set up AR button
      const arButton = document.getElementById('arButton');
      arButton.style.display = 'block';
      
      // Add both touch and click events to the AR button
      arButton.addEventListener('touchend', function(e) {
        e.preventDefault(); // Prevent double events
        startXRSession();
      }, false);
      
      arButton.addEventListener('click', function() {
        startXRSession();
      }, false);
      
      // Create a reticle for placement
      const reticleGeometry = new THREE.RingGeometry(0.15, 0.2, 32);
      reticleGeometry.rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);
      
      document.getElementById('instructions').textContent = 'Press "Enter AR" to begin';
    }
    
    // Start XR Session
    function startXRSession() {
      if (navigator.xr) {
        navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        }).then(onXRSessionStarted)
        .catch(error => {
          console.error('Error starting XR session:', error);
          document.getElementById('debugInfo').textContent = 'XR session failed: ' + error.message;
          fallbackToVideoAR();
        });
      }
    }
    
    // Handle XR session start
    function onXRSessionStarted(session) {
      xrSessionActive = true;
      session.addEventListener('end', onXRSessionEnded);
      
      // Setup hit testing
      session.addEventListener('select', onXRSelect);
      
      // Configure renderer for XR
      renderer.xr.setReferenceSpaceType('local');
      renderer.xr.setSession(session);
      
      document.getElementById('instructions').textContent = 'Looking for surfaces...';
      document.getElementById('arButton').style.display = 'none';
      
      // Request hit test source
      const refSpacePromise = session.requestReferenceSpace('viewer');
      refSpacePromise.then((referenceSpace) => {
        session.requestHitTestSource({ space: referenceSpace })
          .then((source) => {
            hitTestSource = source;
          });
      });
      
      // Start XR animation loop
      renderer.setAnimationLoop(renderXR);
    }
    
    // Handle XR session end
    function onXRSessionEnded() {
      xrSessionActive = false;
      hitTestSource = null;
      hitTestSourceRequested = false;
      
      if (reticle) {
        reticle.visible = false;
      }
      
      document.getElementById('arButton').style.display = 'block';
      document.getElementById('instructions').textContent = 'AR session ended. Press "Enter AR" to begin again.';
      
      // Restart normal animation loop
      animate();
    }
    
    // Handle XR selection
    function onXRSelect(event) {
      if (reticle.visible && !isModelPlaced) {
        // Place model at the reticle position
        model.position.setFromMatrixPosition(reticle.matrix);
        model.visible = true;
        
        // Play video and audio
        if (video) {
          video.play().then(() => {
            video.muted = false; // Unmute after user interaction
          }).catch(err => {
            console.error('Error playing video:', err);
          });
        }
        
        isModelPlaced = true;
        document.getElementById('instructions').textContent = 'Model placed! Use settings ⚙️ to adjust.';
        setTimeout(() => {
          document.getElementById('instructions').style.display = 'none';
        }, 3000);
      }
    }
    
    // Render XR frame
    function renderXR(timestamp, frame) {
      if (frame) {
        if (hitTestSource && !isModelPlaced) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            
            if (document.getElementById('instructions').textContent === 'Looking for surfaces...') {
              document.getElementById('instructions').textContent = 'Surface found! Tap to place model.';
            }
          } else {
            reticle.visible = false;
            
            if (document.getElementById('instructions').textContent === 'Surface found! Tap to place model.') {
              document.getElementById('instructions').textContent = 'Looking for surfaces...';
            }
          }
        }
        
        // Update audio based on distance if model is placed
        if (sound && model && isModelPlaced) {
          const cameraPosition = new THREE.Vector3();
          renderer.xr.getCamera(camera).getWorldPosition(cameraPosition);
          const distance = cameraPosition.distanceTo(model.position);
          
          document.getElementById('debugInfo').textContent = 'Distance to model: ' + distance.toFixed(2) + 'm';
          
          // Set volume based on distance
          const volume = Math.max(0, Math.min(1, 1 - (distance - 3) / 4));
          sound.setVolume(volume);
        }
      }
      
      renderer.render(scene, camera);
    }
    
    // Fallback to video-based AR
    function fallbackToVideoAR() {
      document.getElementById('debugInfo').textContent = 'Using camera-based fallback mode (not true AR)';
      
      // Setup for camera background mode (fallback)
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          const videoElement = document.createElement('video');
          videoElement.srcObject = stream;
          videoElement.play();
          
          const texture = new THREE.VideoTexture(videoElement);
          scene.background = texture;
          
          document.getElementById('instructions').textContent = 'Tap on the screen to place the model';
          
          // Add touch event for model placement
          window.addEventListener('touchend', onMobileTouchEnd, false);
        })
        .catch(function(err) {
          console.error('Unable to access the camera/webcam: ', err);
          document.getElementById('debugInfo').textContent = 'Camera access denied. Using desktop mode.';
          setupDesktopEnvironment(); // Fall back to desktop mode if camera access fails
        });
    }
    
    // Mobile touch handler for fallback mode
    function onMobileTouchEnd(event) {
      if (!modelLoaded || settingsOpen || isModelPlaced) return;
      event.preventDefault();
      
      // Place model in front of camera
      const position = new THREE.Vector3(0, 0, -3);
      model.position.copy(position);
      model.visible = true;
      
      // Play video and audio
      if (video) {
        video.play().then(() => {
          video.muted = false; // Unmute after user interaction
        }).catch(err => {
          console.error('Error playing video:', err);
        });
      }
      
      isModelPlaced = true;
      document.getElementById('instructions').textContent = 'Model placed! Use settings ⚙️ to adjust.';
      setTimeout(() => {
        document.getElementById('instructions').style.display = 'none';
      }, 3000);
    }
    
    // Setup for desktop 3D environment
    function setupDesktopEnvironment() {
      // Create a simple environment with a grid floor
      scene.background = new THREE.Color(0x87CEEB); // Sky blue background
      
      // Add ground
      const groundGeometry = new THREE.PlaneGeometry(50, 50);
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555,
        roughness: 0.8,
        metalness: 0.2
      });
      ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2; // Rotate to be horizontal
      ground.position.y = -0.1;
      ground.receiveShadow = true;
      scene.add(ground);
      
      // Add grid helper
      const gridHelper = new THREE.GridHelper(50, 50);
      scene.add(gridHelper);
      
      // Desktop camera controls
      camera.position.set(0, 1.6, 5); // Position camera at typical eye height
      camera.lookAt(0, 0, 0);
    }
    
    // Load 3D model
    function loadModel() {
      // For demonstration purposes, we'll create a simple model with TV screens
      // In a real app, you would load a GLB/GLTF model
      
      // Create a box to represent the model
      const modelGroup = new THREE.Group();
      
      // Main structure
      const boxGeometry = new THREE.BoxGeometry(2, 1, 1);
      const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
      const box = new THREE.Mesh(boxGeometry, boxMaterial);
      modelGroup.add(box);
      
      // Create TV screens
      const screenGeometry = new THREE.PlaneGeometry(0.8, 0.6);
      const screenMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
      
      // Front TV
      const frontScreen = new THREE.Mesh(screenGeometry, screenMaterial.clone());
      frontScreen.position.set(0, 0, 0.51);
      frontScreen.name = "TV_Screen_Front";
      modelGroup.add(frontScreen);
      
      // Back TV
      const backScreen = new THREE.Mesh(screenGeometry, screenMaterial.clone());
      backScreen.position.set(0, 0, -0.51);
      backScreen.rotation.y = Math.PI;
      backScreen.name = "TV_Screen_Back";
      modelGroup.add(backScreen);
      
      // Create video texture
      video = document.createElement('video');
      video.crossOrigin = 'anonymous';
      video.loop = true;
      video.muted = true; // Initial muted to comply with autoplay policies
      
      // Use a sample video (replace with your actual video URL)
      video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
      video.load();
      
      const videoTexture = new THREE.VideoTexture(video);
      
      // Apply video texture to TV screens
      frontScreen.material.map = videoTexture;
      backScreen.material.map = videoTexture;
      
      // Setup spatial audio
      sound = new THREE.PositionalAudio(audioListener);
      sound.setMediaElementSource(video);
      sound.setRefDistance(3); // Full volume at 3m
      sound.setMaxDistance(7); // No volume at 7m
      sound.setRolloffFactor(1);
      modelGroup.add(sound);
      
      // Hide model until placed
      modelGroup.visible = false;
      scene.add(modelGroup);
      model = modelGroup;
      modelLoaded = true;
    }
    
    // Desktop click handler
    function onClick(event) {
      if (!modelLoaded || settingsOpen || !ground || isModelPlaced) return;
      
      // Calculate mouse position in normalized device coordinates
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
      
      // Update the picking ray with the camera and mouse position
      raycaster.setFromCamera(mouse, camera);
      
      // Calculate objects intersecting the picking ray
      const intersects = raycaster.intersectObject(ground);
      
      if (intersects.length > 0) {
        // Place the model at the intersection point
        model.position.copy(intersects[0].point);
        model.position.y += 0.5; // Lift slightly above ground
        model.visible = true;
        
        // Play video and audio
        if (video) {
          video.play().then(() => {
            video.muted = false; // Unmute after user interaction
          }).catch(err => {
            console.error('Error playing video:', err);
          });
        }
        
        isModelPlaced = true;
        document.getElementById('instructions').textContent = 'Model placed! Use settings ⚙️ to adjust.';
        setTimeout(() => {
          document.getElementById('instructions').style.display = 'none';
        }, 3000);
      }
    }
    
    // Desktop keyboard controls
    function onKeyDown(event) {
      keyStates[event.code] = true;
    }
    
    function onKeyUp(event) {
      keyStates[event.code] = false;
    }
    
    // Desktop mouse wheel zoom
    function onWheel(event) {
      if (!isMobile) {
        // Zoom in/out with mouse wheel
        camera.position.z += event.deltaY * 0.01;
      }
    }
    
    // Toggle settings menu
    function toggleSettings() {
      settingsOpen = !settingsOpen;
      document.getElementById('settingsMenu').style.display = settingsOpen ? 'block' : 'none';
    }
    
    // Rotate model
    function rotateModel(x, y, z) {
      if (model && isModelPlaced) {
        model.rotation.x += x;
        model.rotation.y += y;
        model.rotation.z += z;
      }
    }
    
    // Move model
    function moveModel(x, y, z) {
      if (model && isModelPlaced) {
        model.position.x += x;
        model.position.y += y;
        model.position.z += z;
      }
    }
    
    // Reset model position
    function resetModelPosition() {
      if (model && isModelPlaced) {
        if (isMobile) {
          model.position.set(0, 0, -3);
        } else {
          model.position.set(0, 0.5, -3);
        }
        model.rotation.set(0, 0, 0);
      }
    }
    
    // Handle window resizing
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Process keyboard input for desktop mode
    function processKeyboard() {
      if (isMobile) return;
      
      const moveSpeed = 0.1;
      const rotSpeed = 0.02;
      
      // Movement
      if (keyStates['KeyW']) {
        camera.position.z -= moveSpeed;
      }
      if (keyStates['KeyS']) {
        camera.position.z += moveSpeed;
      }
      if (keyStates['KeyA']) {
        camera.position.x -= moveSpeed;
      }
      if (keyStates['KeyD']) {
        camera.position.x += moveSpeed;
      }
      
      // Rotation
      if (keyStates['ArrowLeft']) {
        camera.rotation.y += rotSpeed;
      }
      if (keyStates['ArrowRight']) {
        camera.rotation.y -= rotSpeed;
      }
      if (keyStates['ArrowUp']) {
        camera.rotation.x += rotSpeed;
      }
      if (keyStates['ArrowDown']) {
        camera.rotation.x -= rotSpeed;
      }
    }
    
    // Standard animation loop
    function animate() {
      if (xrSessionActive) return; // Don't run this loop if XR is active
      
      requestAnimationFrame(animate);
      
      // Process keyboard input for desktop
      processKeyboard();
      
      // Update sound distance model based on camera position
      if (sound && model && isModelPlaced) {
        const distance = camera.position.distanceTo(model.position);
        document.getElementById('debugInfo').textContent = 
          (isMobile ? 'Mobile Mode' : 'Desktop Mode') + 
          ' - Distance to model: ' + distance.toFixed(2) + 'm';
          
        // Optional volume visualization
        const volume = Math.max(0, Math.min(1, 1 - (distance - 3) / 4));
        sound.setVolume(volume);
      }
      
      renderer.render(scene, camera);
    }
    
    // Load Three.js dynamically
    function loadScript(url, callback) {
      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = url;
      script.onload = callback;
      document.head.appendChild(script);
    }
    
    // Start loading dependencies
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function() {
      // Initialize app once Three.js is loaded
      init();
    });
  </script>
</body>
</html>
