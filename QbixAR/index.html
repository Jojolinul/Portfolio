<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive AR/3D Web App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #debugInfo {
      position: fixed;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 1;
      color: white;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
    }
    .settingsButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
    }
    .settingsMenu {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 10px;
      display: none;
      z-index: 10;
    }
    .settingsMenu button {
      display: block;
      margin: 5px 0;
      width: 100%;
      padding: 8px;
      background-color: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 5px;
      color: black;
      cursor: pointer;
    }
    .instructions {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 10px;
      z-index: 10;
      text-align: center;
    }
    #desktopControls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 10px;
      color: white;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <div class="instructions" id="instructions"></div>
  <div id="debugInfo"></div>
  
  <button class="settingsButton" id="settingsButton">⚙️</button>
  <div class="settingsMenu" id="settingsMenu">
    <button id="rotateXPlus">Rotate X +</button>
    <button id="rotateXMinus">Rotate X -</button>
    <button id="rotateYPlus">Rotate Y +</button>
    <button id="rotateYMinus">Rotate Y -</button>
    <button id="moveForward">Move Forward</button>
    <button id="moveBackward">Move Backward</button>
    <button id="moveLeft">Move Left</button>
    <button id="moveRight">Move Right</button>
    <button id="resetPosition">Reset Position</button>
  </div>
  
  <div id="desktopControls">
    <p>Desktop Controls:</p>
    <p>WASD - Move Camera</p>
    <p>Arrow Keys - Rotate Camera</p>
    <p>Click - Place Model</p>
    <p>Scroll - Zoom In/Out</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Global variables
    let camera, scene, renderer;
    let model, video, audioListener, sound;
    let isModelPlaced = false;
    let modelLoaded = false;
    let settingsOpen = false;
    let isMobile = false;
    let controls;
    let ground;
    let raycaster, mouse;
    let keyStates = {};
    
    // Detect if device is mobile
    function detectMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
             (window.innerWidth <= 800 && window.innerHeight <= 600);
    }
    
    // Initialize the application
    function init() {
      isMobile = detectMobile();
      const debugInfo = document.getElementById('debugInfo');
      debugInfo.textContent = isMobile ? 'Mobile Mode' : 'Desktop Mode';
      
      // Update instructions based on device type
      const instructions = document.getElementById('instructions');
      if (isMobile) {
        instructions.textContent = 'Tap on the screen to place the 3D model';
        document.getElementById('desktopControls').style.display = 'none';
      } else {
        instructions.textContent = 'Click anywhere to place the 3D model';
        document.getElementById('desktopControls').style.display = 'block';
      }
      
      // Create scene
      scene = new THREE.Scene();
      
      // Create camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // Eye level height
      
      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x000000);
      document.body.appendChild(renderer.domElement);
      
      // Add lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(0, 10, 5);
      scene.add(directionalLight);
      
      // Audio listener for spatial audio
      audioListener = new THREE.AudioListener();
      camera.add(audioListener);
      
      // Setup based on device type
      if (isMobile) {
        setupMobileAR();
      } else {
        setupDesktopEnvironment();
      }
      
      // Load 3D model
      loadModel();
      
      // Raycaster for object placement
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();
      
      // Add event listeners
      window.addEventListener('resize', onWindowResize);
      
      if (isMobile) {
        window.addEventListener('touchend', onTouchEnd);
      } else {
        window.addEventListener('click', onClick);
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('wheel', onWheel);
      }
      
      // Settings menu interactions
      document.getElementById('settingsButton').addEventListener('click', toggleSettings);
      document.getElementById('rotateXPlus').addEventListener('click', () => rotateModel(0.1, 0, 0));
      document.getElementById('rotateXMinus').addEventListener('click', () => rotateModel(-0.1, 0, 0));
      document.getElementById('rotateYPlus').addEventListener('click', () => rotateModel(0, 0.1, 0));
      document.getElementById('rotateYMinus').addEventListener('click', () => rotateModel(0, -0.1, 0));
      document.getElementById('moveForward').addEventListener('click', () => moveModel(0, 0, -0.1));
      document.getElementById('moveBackward').addEventListener('click', () => moveModel(0, 0, 0.1));
      document.getElementById('moveLeft').addEventListener('click', () => moveModel(-0.1, 0, 0));
      document.getElementById('moveRight').addEventListener('click', () => moveModel(0.1, 0, 0));
      document.getElementById('resetPosition').addEventListener('click', resetModelPosition);
      
      // Start animation loop
      animate();
    }
    
    // Setup for mobile AR experience
    // Full implementation of setupMobileAR using WebXR
function setupMobileAR() {
  // Check if WebXR is supported with AR
  if (navigator.xr && navigator.xr.isSessionSupported) {
    // Check if AR is supported by the browser
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (supported) {
        // Setup WebXR support for Three.js
        renderer.xr.enabled = true;
        
        // Create AR button
        const arButton = document.createElement('button');
        arButton.id = 'ar-button';
        arButton.textContent = 'Enter AR';
        arButton.style.position = 'fixed';
        arButton.style.bottom = '80px';
        arButton.style.left = '50%';
        arButton.style.transform = 'translateX(-50%)';
        arButton.style.padding = '12px 24px';
        arButton.style.border = 'none';
        arButton.style.borderRadius = '4px';
        arButton.style.background = '#4285f4';
        arButton.style.color = 'white';
        arButton.style.fontWeight = 'bold';
        arButton.style.zIndex = '10';
        document.body.appendChild(arButton);
        
        // Create controller for AR interactions
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', onARSelect);
        scene.add(controller);
        
        // Add reticle for hit testing
        const reticleGeometry = new THREE.RingGeometry(0.15, 0.2, 32);
        reticleGeometry.rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial();
        const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);
        
        // Setup hit testing
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let modelPlaced = false;
        
        // AR session setup
        arButton.addEventListener('click', () => {
          navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test', 'dom-overlay'],
            domOverlay: { root: document.body }
          }).then(onSessionStarted);
        });
        
        // AR session start handler
        function onSessionStarted(session) {
          session.addEventListener('end', onSessionEnded);
          
          renderer.xr.setReferenceSpaceType('local');
          renderer.xr.setSession(session);
          
          document.getElementById('instructions').textContent = 'Scan the floor and tap to place model';
          
          // Setup hit testing
          session.requestReferenceSpace('viewer').then((referenceSpace) => {
            session.requestHitTestSource({ space: referenceSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          
          session.addEventListener('select', () => {
            if (reticle.visible && !modelPlaced) {
              // Place model at the reticle position
              model.position.setFromMatrixPosition(reticle.matrix);
              model.visible = true;
              modelPlaced = true;
              isModelPlaced = true;
              
              // Play video and audio
              playMedia();
              
              // Update instructions
              document.getElementById('instructions').textContent = 'Model placed! Use settings ⚙️ to adjust';
              setTimeout(() => {
                document.getElementById('instructions').style.display = 'none';
              }, 3000);
            }
          });
        }
        
        // AR session end handler
        function onSessionEnded() {
          hitTestSource = null;
          hitTestSourceRequested = false;
          document.getElementById('instructions').textContent = 'AR session ended';
        }
        
        // Add XR frame listener for hit testing
        renderer.setAnimationLoop(function(timestamp, frame) {
          if (frame) {
            // Do hit testing if hit test source is available
            if (hitTestSource && !modelPlaced) {
              const referenceSpace = renderer.xr.getReferenceSpace();
              const hitTestResults = frame.getHitTestResults(hitTestSource);
              
              if (hitTestResults.length) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(referenceSpace);
                
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
              } else {
                reticle.visible = false;
              }
            }
            
            // Update audio based on distance
            if (sound && model && isModelPlaced) {
              const cameraPosition = new THREE.Vector3();
              renderer.xr.getCamera().getWorldPosition(cameraPosition);
              const distance = cameraPosition.distanceTo(model.position);
              document.getElementById('debugInfo').innerHTML = 'Distance to model: ' + distance.toFixed(2) + 'm';
              
              // Optional volume visualization
              const volume = Math.max(0, Math.min(1, 1 - (distance - 3) / 4));
              sound.setVolume(volume);
            }
          }
          
          renderer.render(scene, camera);
        });
      } else {
        console.warn('WebXR AR not supported on this device');
        fallbackToVideoAR();
      }
    });
  } else {
    console.warn('WebXR not supported on this browser');
    fallbackToVideoAR();
  }
}

// Fallback to video-based AR when WebXR is not available
function fallbackToVideoAR() {
  document.getElementById('debugInfo').innerHTML = 'Using camera-based fallback mode (not true AR)';
  
  // Setup for camera background mode (fallback)
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) {
      const videoElement = document.createElement('video');
      videoElement.srcObject = stream;
      videoElement.play();
      
      const texture = new THREE.VideoTexture(videoElement);
      scene.background = texture;
      
      // For camera-based AR, add a simple tap handler for model placement
      window.addEventListener('touchend', (event) => {
        if (!isModelPlaced && modelLoaded) {
          // Place model in front of camera
          const position = new THREE.Vector3(0, 0, -3);
          position.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(camera.rotation));
          position.add(camera.position);
          
          model.position.copy(position);
          model.visible = true;
          
          // Play video and audio
          playMedia();
          
          isModelPlaced = true;
          updateInstructions();
        }
      });
    })
    .catch(function(err) {
      console.error('Unable to access the camera/webcam: ', err);
      document.getElementById('debugInfo').innerHTML = 'Camera access denied. Using desktop mode.';
      setupDesktopEnvironment(); // Fall back to desktop mode if camera access fails
    });
}
    
    // Setup for desktop 3D environment
    function setupDesktopEnvironment() {
      // Create a simple environment with a grid floor
      scene.background = new THREE.Color(0x87CEEB); // Sky blue background
      
      // Add ground
      const groundGeometry = new THREE.PlaneGeometry(50, 50);
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x555555,
        roughness: 0.8,
        metalness: 0.2
      });
      ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2; // Rotate to be horizontal
      ground.position.y = -0.1;
      ground.receiveShadow = true;
      scene.add(ground);
      
      // Add grid helper
      const gridHelper = new THREE.GridHelper(50, 50);
      scene.add(gridHelper);
      
      // Desktop camera controls
      camera.position.set(0, 1.6, 5); // Position camera at typical eye height
      camera.lookAt(0, 0, 0);
    }
    
    // Load 3D model
    function loadModel() {
      // For demonstration purposes, we'll create a simple model with TV screens
      // In a real app, you would load a GLB/GLTF model
      
      // Create a box to represent the model
      const modelGroup = new THREE.Group();
      
      // Main structure
      const boxGeometry = new THREE.BoxGeometry(2, 1, 1);
      const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
      const box = new THREE.Mesh(boxGeometry, boxMaterial);
      modelGroup.add(box);
      
      // Create TV screens
      const screenGeometry = new THREE.PlaneGeometry(0.8, 0.6);
      const screenMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
      
      // Front TV
      const frontScreen = new THREE.Mesh(screenGeometry, screenMaterial.clone());
      frontScreen.position.set(0, 0, 0.51);
      frontScreen.name = "TV_Screen_Front";
      modelGroup.add(frontScreen);
      
      // Back TV
      const backScreen = new THREE.Mesh(screenGeometry, screenMaterial.clone());
      backScreen.position.set(0, 0, -0.51);
      backScreen.rotation.y = Math.PI;
      backScreen.name = "TV_Screen_Back";
      modelGroup.add(backScreen);
      
      // Create video texture
      video = document.createElement('video');
      video.crossOrigin = 'anonymous';
      video.loop = true;
      video.muted = true; // Initial muted to comply with autoplay policies
      
      // Use a sample video (replace with your actual video URL)
      video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
      video.load();
      
      const videoTexture = new THREE.VideoTexture(video);
      
      // Apply video texture to TV screens
      frontScreen.material.map = videoTexture;
      backScreen.material.map = videoTexture;
      
      // Setup spatial audio
      sound = new THREE.PositionalAudio(audioListener);
      sound.setMediaElementSource(video);
      sound.setRefDistance(3); // Full volume at 3m
      sound.setMaxDistance(7); // No volume at 7m
      sound.setRolloffFactor(1);
      modelGroup.add(sound);
      
      // Hide model until placed
      modelGroup.visible = false;
      scene.add(modelGroup);
      model = modelGroup;
      modelLoaded = true;
    }
    
    // Place model on mobile touch
    function onTouchEnd(event) {
      if (!modelLoaded || settingsOpen) return;
      
      event.preventDefault();
      
      if (!isModelPlaced) {
        // In a real AR app with WebXR, we would use hit testing 
        // For now, just place in front of the camera
        const position = new THREE.Vector3(0, 0, -3);
        position.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(camera.rotation));
        position.add(camera.position);
        
        model.position.copy(position);
        model.visible = true;
        
        // Play video and audio
        playMedia();
        
        isModelPlaced = true;
        updateInstructions();
      }
    }
    
    // Place model on desktop click
    function onClick(event) {
      if (!modelLoaded || settingsOpen || !ground) return;
      
      // Calculate mouse position in normalized device coordinates
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
      
      // Update the picking ray with the camera and mouse position
      raycaster.setFromCamera(mouse, camera);
      
      // Calculate objects intersecting the picking ray
      const intersects = raycaster.intersectObject(ground);
      
      if (intersects.length > 0 && !isModelPlaced) {
        // Place the model at the intersection point
        model.position.copy(intersects[0].point);
        model.position.y += 0.5; // Lift slightly above ground
        model.visible = true;
        
        // Play video and audio
        playMedia();
        
        isModelPlaced = true;
        updateInstructions();
      }
    }
    
    // Play video and audio
    function playMedia() {
      if (video) {
        video.play().then(() => {
          video.muted = false; // Unmute after user interaction
          console.log('Video playing');
        }).catch(err => {
          console.error('Error playing video:', err);
        });
      }
    }
    
    // Update instructions after model placement
    function updateInstructions() {
      document.getElementById('instructions').innerHTML = 'Model placed! Use settings ⚙️ to adjust.';
      setTimeout(() => {
        document.getElementById('instructions').style.display = 'none';
      }, 3000);
    }
    
    // Desktop keyboard controls
    function onKeyDown(event) {
      keyStates[event.code] = true;
    }
    
    function onKeyUp(event) {
      keyStates[event.code] = false;
    }
    
    // Desktop mouse wheel zoom
    function onWheel(event) {
      if (!isMobile) {
        // Zoom in/out with mouse wheel
        camera.position.z += event.deltaY * 0.01;
      }
    }
    
    // Toggle settings menu
    function toggleSettings() {
      settingsOpen = !settingsOpen;
      document.getElementById('settingsMenu').style.display = settingsOpen ? 'block' : 'none';
    }
    
    // Rotate model
    function rotateModel(x, y, z) {
      if (model && isModelPlaced) {
        model.rotation.x += x;
        model.rotation.y += y;
        model.rotation.z += z;
      }
    }
    
    // Move model
    function moveModel(x, y, z) {
      if (model && isModelPlaced) {
        model.position.x += x;
        model.position.y += y;
        model.position.z += z;
      }
    }
    
    // Reset model position
    function resetModelPosition() {
      if (model && isModelPlaced) {
        if (isMobile) {
          const position = new THREE.Vector3(0, 0, -3);
          position.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(camera.rotation));
          position.add(camera.position);
          model.position.copy(position);
        } else {
          model.position.set(0, 0.5, -3);
        }
        model.rotation.set(0, 0, 0);
      }
    }
    
    // Handle window resizing
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Process keyboard input for desktop mode
    function processKeyboard() {
      if (isMobile) return;
      
      const moveSpeed = 0.1;
      const rotSpeed = 0.02;
      
      // Movement
      if (keyStates['KeyW']) {
        camera.position.z -= moveSpeed;
      }
      if (keyStates['KeyS']) {
        camera.position.z += moveSpeed;
      }
      if (keyStates['KeyA']) {
        camera.position.x -= moveSpeed;
      }
      if (keyStates['KeyD']) {
        camera.position.x += moveSpeed;
      }
      
      // Rotation
      if (keyStates['ArrowLeft']) {
        camera.rotation.y += rotSpeed;
      }
      if (keyStates['ArrowRight']) {
        camera.rotation.y -= rotSpeed;
      }
      if (keyStates['ArrowUp']) {
        camera.rotation.x += rotSpeed;
      }
      if (keyStates['ArrowDown']) {
        camera.rotation.x -= rotSpeed;
      }
    }
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      // Process keyboard input for desktop
      processKeyboard();
      
      // Update sound distance model based on camera position
      if (sound && model && isModelPlaced) {
        const distance = camera.position.distanceTo(model.position);
        document.getElementById('debugInfo').innerHTML = 
          (isMobile ? 'Mobile Mode' : 'Desktop Mode') + 
          ' - Distance to model: ' + distance.toFixed(2) + 'm';
          
        // Optional volume visualization
        const volume = Math.max(0, Math.min(1, 1 - (distance - 3) / 4));
        sound.setVolume(volume);
      }
      
      renderer.render(scene, camera);
    }
    
    // Start the application when page loads
    window.onload = init;
  </script>
</body>
</html>
